<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" style="max-width: 300px;">
  <style>
    /* Animação de desenho do escudo */
    .shield {
      fill: #f0f4f8;
      stroke: #2b6cb0;
      stroke-width: 8;
      stroke-linejoin: round;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawShield 1.5s ease-in-out forwards;
    }
    
    /* Corpo do cadeado muda para verde ao autenticar */
    .lock-body {
      fill: #2b6cb0;
      animation: authSuccessColor 4s infinite;
    }
    
    /* A haste do cadeado sobe (destranca) e muda de cor */
    .shackle {
      fill: none;
      stroke: #2b6cb0;
      stroke-width: 8;
      stroke-linecap: round;
      transform-origin: 100px 100px;
      animation: unlock 4s infinite;
    }
    
    .keyhole {
      fill: #ffffff;
    }
    
    /* Pulso radial indicando sucesso */
    .pulse {
      fill: none;
      stroke: #48bb78;
      stroke-width: 4;
      opacity: 0;
      transform-origin: center;
      animation: pulseRing 4s infinite;
    }
    
    /* Sinal de "Check" desenhado ao abrir */
    .check {
      fill: none;
      stroke: #ffffff;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: drawCheck 4s infinite;
    }
    
    /* Oculta o buraco da fechadura quando abre */
    .keyhole-group {
      animation: hideKeyhole 4s infinite;
    }

    /* Keyframes das animações */
    @keyframes drawShield {
      to { stroke-dashoffset: 0; }
    }
    
    @keyframes unlock {
      0%, 15% { transform: translateY(0); stroke: #2b6cb0; }
      30%, 75% { transform: translateY(-15px); stroke: #48bb78; }
      90%, 100% { transform: translateY(0); stroke: #2b6cb0; }
    }
    
    @keyframes authSuccessColor {
      0%, 15% { fill: #2b6cb0; }
      30%, 75% { fill: #48bb78; }
      90%, 100% { fill: #2b6cb0; }
    }
    
    @keyframes pulseRing {
      0%, 25% { opacity: 0; transform: scale(0.8); }
      35% { opacity: 0.6; transform: scale(1); }
      75% { opacity: 0; transform: scale(1.5); }
      100% { opacity: 0; }
    }
    
    @keyframes drawCheck {
      0%, 25% { stroke-dashoffset: 50; opacity: 0; }
      35%, 75% { stroke-dashoffset: 0; opacity: 1; }
      90%, 100% { stroke-dashoffset: 50; opacity: 0; }
    }
    
    @keyframes hideKeyhole {
      0%, 20% { opacity: 1; transform: scale(1); }
      25%, 80% { opacity: 0; transform: scale(0.5); }
      85%, 100% { opacity: 1; transform: scale(1); }
    }
  </style>

  <circle cx="100" cy="100" r="45" class="pulse" />

  <path class="shield" d="M 100 20 C 100 20 160 40 160 40 C 160 100 150 150 100 180 C 50 150 40 100 40 40 C 40 40 100 20 100 20 Z" />

  <path class="shackle" d="M 75 100 V 80 A 25 25 0 0 1 125 80 V 100" />

  <rect x="65" y="95" width="70" height="50" rx="8" class="lock-body" />

  <g class="keyhole-group" style="transform-origin: 100px 120px;">
    <circle cx="100" cy="115" r="5" class="keyhole" />
    <path d="M 97 115 L 95 128 L 105 128 L 103 115 Z" class="keyhole" />
  </g>

  <path class="check" d="M 85 120 L 95 130 L 115 110" />

</svg>