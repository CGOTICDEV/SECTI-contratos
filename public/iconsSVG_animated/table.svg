<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%" style="max-width: 450px; background-color: transparent;">
  <style>
    :root {
      --table-header: #2c5282;
      --table-row-odd: #edf2f7;
      --table-row-even: #e2e8f0;
      --text-placeholder: #a0aec0;
      --success-color: #48bb78;
      --contract-icon: #4299e1;
      --border-color: #e2e8f0;
    }

    /* Animação de entrada das linhas */
    .row-entry {
      opacity: 0;
      transform: translateX(-20px);
      animation: slideInRow 0.6s ease-out forwards;
    }

    .row-1 { animation-delay: 0.2s; }
    .row-2 { animation-delay: 0.4s; }
    .row-3 { animation-delay: 0.6s; }
    .row-4 { animation-delay: 0.8s; }

    /* Animação da linha de contrato específico */
    .contract-row-bg {
      fill: var(--table-row-odd);
      animation: highlightRow 4s infinite;
    }

    .placeholder-data {
      animation: hideData 4s infinite;
    }

    .contract-finalized {
      opacity: 0;
      animation: showContract 4s infinite;
    }

    .checkmark-path {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: drawCheck 4s infinite;
    }

    @keyframes slideInRow {
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes highlightRow {
      0%, 40% { fill: var(--table-row-odd); }
      50%, 90% { fill: #ebf8ff; }
      100% { fill: var(--table-row-odd); }
    }
    
    @keyframes hideData {
      0%, 40% { opacity: 1; }
      45%, 100% { opacity: 0; }
    }

    @keyframes showContract {
      0%, 45% { opacity: 0; transform: scale(0.9); }
      50%, 90% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; }
    }

    @keyframes drawCheck {
      0%, 50% { stroke-dashoffset: 40; }
      65%, 90% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 40; }
    }
  </style>

  <rect x="10" y="10" width="280" height="180" rx="8" fill="#ffffff" />
  
  <rect x="12" y="12" width="276" height="30" rx="6" fill="var(--table-header)" />
  <rect x="30" y="22" width="40" height="10" rx="2" fill="#63b3ed" opacity="0.5"/>
  <rect x="100" y="22" width="60" height="10" rx="2" fill="#63b3ed" opacity="0.5"/>
  <rect x="200" y="22" width="50" height="10" rx="2" fill="#63b3ed" opacity="0.5"/>

  <g transform="translate(0, 50)">
    
    <g class="row-entry row-1">
      <rect x="12" y="0" width="276" height="25" rx="4" fill="var(--table-row-odd)"/>
      <rect x="30" y="8" width="30" height="8" rx="2" fill="var(--text-placeholder)"/>
      <rect x="100" y="8" width="80" height="8" rx="2" fill="var(--text-placeholder)"/>
    </g>

    <g class="row-entry row-2" transform="translate(0, 30)">
      <rect x="12" y="0" width="276" height="25" rx="4" fill="var(--table-row-even)"/>
      <rect x="30" y="8" width="30" height="8" rx="2" fill="var(--text-placeholder)"/>
      <rect x="100" y="8" width="70" height="8" rx="2" fill="var(--text-placeholder)"/>
    </g>

    <g class="row-entry row-3" transform="translate(0, 60)">
      <rect class="contract-row-bg" x="12" y="0" width="276" height="35" rx="4"/>
      
      <g class="placeholder-data">
         <rect x="30" y="13" width="30" height="8" rx="2" fill="var(--text-placeholder)"/>
         <rect x="100" y="13" width="60" height="8" rx="2" fill="var(--text-placeholder)"/>
      </g>
      
      <g class="contract-finalized" transform="translate(100, 5)">
        <path d="M 5 2 C 5 2, 15 2, 15 2 L 22 9 L 22 23 C 22 23, 22 25, 20 25 L 5 25 C 5 25, 3 25, 3 23 L 3 4 C 3 4, 3 2, 5 2 Z" fill="white" stroke="var(--contract-icon)" stroke-width="2"/>
        <path d="M 15 2 L 15 9 L 22 9" fill="var(--contract-icon)" opacity="0.3"/>
        <line x1="7" y1="14" x2="18" y2="14" stroke="var(--contract-icon)" stroke-width="2" stroke-linecap="round"/>
        <line x1="7" y1="18" x2="14" y2="18" stroke="var(--contract-icon)" stroke-width="2" stroke-linecap="round"/>
        
        <g transform="translate(25, 12)">
           <circle cx="10" cy="10" r="12" fill="var(--success-color)"/>
           <path class="checkmark-path" d="M 5 10 L 9 14 L 15 6" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        
        <rect x="55" y="10" width="60" height="10" rx="2" fill="var(--success-color)" opacity="0.8"/>
      </g>
    </g>

    <g class="row-entry row-4" transform="translate(0, 100)">
      <rect x="12" y="0" width="276" height="25" rx="4" fill="var(--table-row-even)"/>
      <rect x="30" y="8" width="30" height="8" rx="2" fill="var(--text-placeholder)"/>
      <rect x="100" y="8" width="50" height="8" rx="2" fill="var(--text-placeholder)"/>
    </g>
  </g>

  <rect x="10" y="10" width="280" height="180" rx="8" fill="none" stroke="var(--border-color)" stroke-width="2"/>

</svg>