<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%" style="max-width: 450px;">
  <style>
    /* Paleta de Cores */
    :root {
      --color-center: #3182ce; /* Azul Destaque para o perfil principal */
      --color-sides: #a0aec0;  /* Cinza azulado para os perfis secundários */
    }

    /* Estilo base invisível para a entrada */
    .profile {
      opacity: 0;
      transform-origin: bottom center;
    }

    /* Animações individuais com delays diferentes */
    .profile-center {
      fill: var(--color-center);
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, 
                 float 3s ease-in-out infinite alternate;
      animation-delay: 0.1s, 0.7s;
    }

    .profile-side1 {
      fill: var(--color-sides);
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, 
                 float 3s ease-in-out infinite alternate;
      animation-delay: 0.3s, 0.9s;
    }

    .profile-side2 {
      fill: var(--color-sides);
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, 
                 float 3s ease-in-out infinite alternate;
      animation-delay: 0.5s, 1.1s;
    }

    /* Keyframes */
    
    /* Efeito de "pulo" suave na entrada */
    @keyframes popIn {
      0% { opacity: 0; transform: translateY(20px) scale(0.8); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Efeito contínuo de flutuação (respiração) */
    @keyframes float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-6px); }
    }
  </style>

  <g transform="translate(50, 100) scale(0.8)">
    <g class="profile profile-side1">
      <circle cx="40" cy="30" r="25" />
      <path d="M 0 100 C 0 60, 80 60, 80 100 Z" />
    </g>
  </g>

  <g transform="translate(186, 100) scale(0.8)">
    <g class="profile profile-side2">
      <circle cx="40" cy="30" r="25" />
      <path d="M 0 100 C 0 60, 80 60, 80 100 Z" />
    </g>
  </g>

  <g transform="translate(105, 65) scale(1.1)">
    <g class="profile profile-center">
      <circle cx="40" cy="30" r="25" />
      <path d="M 0 100 C 0 60, 80 60, 80 100 Z" />
    </g>
  </g>

</svg>